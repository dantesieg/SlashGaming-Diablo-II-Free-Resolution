name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/setup-nasm@v1
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -iname "SGD2FreeRes*.dll" -path "*Release*" -exec cp {} out/ \;
          cp COPYING LICENSE.md README.md CHANGELOG.md out/
          echo "Source: https://github.com/${{ github.repository }} commit ${{ github.sha }}" > out/SOURCE.txt
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SGD2FreeRes-Release
          path: out/
